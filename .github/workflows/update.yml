name: Update flake lock

on:
  pull_request:
    paths:
      - .github/workflows/update.yml
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1" # every Monday at 6:00 UTC

jobs:
  update:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        base: [master, v0.9] # supported branches; edit on each release
    concurrency:
      group: nix-flake-update-${{ matrix.base }}
      cancel-in-progress: true
    env:
      BASE: ${{ matrix.base }}
      BRANCH: auto/flake-update-${{ matrix.base }}
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Get Thymis App Token
        id: generate-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.THYMIS_APP_ID }}
          private-key: ${{ secrets.THYMIS_APP_PRIVATE_KEY }}
      - uses: actions/checkout@v5
        with:
          token: ${{ steps.generate-token.outputs.token }}
          ref: ${{ matrix.base }}
          fetch-depth: 0
      - uses: ./.github/actions/setup-nix
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set git config
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
        run: |
          git fetch --all
          USER_NAME=${{ steps.generate-token.outputs.app-slug }}[bot]
          USER_ID=$(gh api "/users/${USER_NAME}" --jq '.id')
          USER_EMAIL="${USER_ID}+${{ steps.generate-token.outputs.app-slug }}[bot]@users.noreply.github.com"
          git config user.email $USER_EMAIL
          git config user.name $USER_NAME
      - uses: ./.github/actions/snapshot-nix-store

      - name: Update flake lock on fixed branch
        id: update
        run: |
          git switch -C "$BRANCH" # always restart from the base tip
          cp flake.lock /tmp/flake.lock.old
          nix flake update --commit-lock-file
          if git diff --quiet "origin/$BASE" -- flake.lock; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "inputs=$(python3 .github/scripts/changed_inputs.py /tmp/flake.lock.old flake.lock)" >> "$GITHUB_OUTPUT"
            echo "label=$(python3 .github/scripts/changed_inputs.py /tmp/flake.lock.old flake.lock --label)" >> "$GITHUB_OUTPUT"
          fi
      - name: Upload new store paths to Nix cache
        if: always()
        uses: ./.github/actions/upload-nix-store-diff
        with:
          aws_access_key_id: ${{ secrets.NIX_CACHE_AWS_ACCESS_KEY_ID }}
          aws_secret_access_key: ${{ secrets.NIX_CACHE_AWS_SECRET_ACCESS_KEY }}
          signing_key: ${{ secrets.NIX_CACHE_SIGNING_KEY }}
      - name: Push, create or refresh PR, close superseded
        if: steps.update.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
          LABEL: ${{ steps.update.outputs.label }}
          INPUTS: ${{ steps.update.outputs.inputs }}
        run: |
          git push --force origin "HEAD:$BRANCH"
          TITLE="flake.lock: update ($BASE)"
          BODY="Weekly lock refresh for \`$BASE\`. Risk label: **$LABEL**. Changed inputs: $INPUTS. Re-created every run from the tip of \`$BASE\`; do not edit. Merging this PR is the patch update."
          gh label create "risk:lock-only" --color 0e8a16 2>/dev/null || true
          gh label create "risk:boot-firmware-kernel" --color d93f0b 2>/dev/null || true
          PR=$(gh pr list --state open --head "$BRANCH" --base "$BASE" --json number -q '.[0].number')
          if [ -z "$PR" ]; then
            gh pr create --base "$BASE" --head "$BRANCH" --title "$TITLE" --body "$BODY" --label "$LABEL"
          else
            gh pr edit "$PR" --title "$TITLE" --body "$BODY" \
              --remove-label risk:lock-only --remove-label risk:boot-firmware-kernel --add-label "$LABEL"
          fi
          for old in update-flake-lock renovate/lock-file-maintenance; do
            for n in $(gh pr list --state open --head "$old" --base "$BASE" --json number -q '.[].number'); do
              gh pr close "$n" --delete-branch --comment "Superseded by $BRANCH"
            done
          done
      - name: Close standing PR when nothing changed
        if: steps.update.outputs.changed == 'false'
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
        run: |
          for n in $(gh pr list --state open --head "$BRANCH" --json number -q '.[].number'); do
            gh pr close "$n" --delete-branch --comment "Lock already up to date"
          done
